name: 'Upstream Sync - Specific Date or Latest'

on:
  schedule:
    # 定时任务（每天 UTC 0:00）会使用下方默认值（空 = 拉取最新）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      sync_test_mode:
        description: 'Fork Sync Test Mode (skip push)'
        type: boolean
        default: false
      target_date:
        description: 'Date to sync to (format: YYYY-MM-DD). Leave empty to sync latest.'
        type: string
        default: ''            # 默认空 → 同步最新

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    name: Sync upstream (date or latest)
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          ref: sync
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://x-access-token:${{ secrets.UPSTREAM_REPO_SECRET }}@github.com/innei-dev/Yohaku.git
          git fetch upstream main

      - name: Determine target commit (date or latest)
        id: date_commit
        run: |
          DATE="${{ inputs.target_date }}"
          if [ -z "$DATE" ]; then
            # 无日期 → 取 upstream/main 最新提交
            COMMIT=$(git rev-parse upstream/main)
            echo "Syncing to latest commit: $COMMIT"
          else
            # 有日期 → 查找该日期 23:59:59 UTC 前的最后提交
            COMMIT=$(git rev-list -1 --before="${DATE}T23:59:59Z" upstream/main)
            if [ -z "$COMMIT" ]; then
              echo "No commit found before $DATE"
              exit 1
            fi
            echo "Syncing to commit at $DATE: $COMMIT"
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Reset sync branch to target commit
        run: |
          git reset --hard ${{ steps.date_commit.outputs.commit }}
          echo "Local sync branch now at: $(git rev-parse HEAD)"

      - name: Push to target repo
        if: ${{ !inputs.sync_test_mode }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.UPSTREAM_REPO_SECRET }}@github.com/${{ github.repository }}.git
          git push origin sync --force

      - name: Skip push (test mode)
        if: ${{ inputs.sync_test_mode }}
        run: echo "Test mode enabled, push skipped."
